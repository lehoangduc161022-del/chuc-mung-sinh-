<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chúc mừng sinh nhật</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a0d1c;--bg2:#0e0509;--gold:#e9c98a;--rose:#f3a9bb;--cream:#fdf0e1;--wine:#8e2c4a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg2);overscroll-behavior:none}
body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--cream);
 background:radial-gradient(ellipse at 50% 20%,var(--bg1),var(--bg2) 75%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);text-align:center;
 opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.screen.active{opacity:1;visibility:visible}
.script{font-family:'Great Vibes','Brush Script MT',cursive;color:var(--gold);font-weight:400}

/* ===== Màn 1 ===== */
#s1{cursor:pointer}
#s1 p{font-size:clamp(20px,5.6vw,28px);line-height:1.5;max-width:300px;margin-top:28px;font-style:italic}
.heart{font-size:84px;color:var(--rose);animation:beat 1.8s ease-in-out infinite;
 filter:drop-shadow(0 0 18px rgba(243,169,187,.9)) drop-shadow(0 0 40px rgba(233,201,138,.5))}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

#muteBtn{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:100;width:42px;height:42px;border-radius:50%;
 border:1px solid rgba(233,201,138,.6);background:rgba(20,7,13,.55);color:var(--gold);font-size:20px;line-height:1;cursor:pointer;
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#s1.magic p{opacity:0;transition:opacity 1s}
#s1.magic .heart{animation:magic 1.5s ease-in forwards}
@keyframes magic{0%{transform:scale(1)}100%{transform:scale(2.4);filter:drop-shadow(0 0 40px #fff) drop-shadow(0 0 90px rgba(233,201,138,.9));opacity:.15}}
/* ===== Màn 2 ===== */
#num{font-family:'Great Vibes',cursive;font-size:clamp(150px,48vw,230px);line-height:1;color:var(--gold);
 text-shadow:0 0 30px rgba(233,201,138,.55),0 0 80px rgba(243,169,187,.4)}
#num.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.35);opacity:.2}30%{opacity:1}100%{transform:scale(1)}}
#tease{font-size:clamp(20px,5.4vw,26px);font-style:italic;min-height:2em;margin-top:10px;transition:opacity .4s}

/* ===== Màn 3 ===== */
#s3 h2{font-size:clamp(34px,10vw,48px);margin-bottom:4px}
#hint3{font-size:18px;font-style:italic;opacity:.85;margin-bottom:6px;min-height:1.4em}
#cakeWrap{position:relative;width:min(88vw,340px);height:min(62dvh,470px)}
#cake{width:100%;height:100%;overflow:visible}
#glow{position:absolute;left:50%;top:6%;width:220px;height:220px;margin-left:-110px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,200,110,.5),transparent 68%);animation:glow 2s ease-in-out infinite;transition:opacity .6s}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#flameBox{position:absolute;left:50%;top:calc(17.5% - 38px);width:44px;height:64px;margin-left:-22px;cursor:pointer;
 transform-origin:50% 100%;transition:transform .15s}
.flame{position:absolute;left:8px;bottom:6px;width:28px;height:52px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
 background:radial-gradient(ellipse at 50% 78%,#fff6c8 0,#ffd067 38%,#ff8a2a 70%,rgba(255,90,20,0) 100%);
 filter:blur(.6px);transform-origin:50% 100%;animation:flick .22s ease-in-out infinite alternate;
 box-shadow:0 0 22px 8px rgba(255,170,70,.55)}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.08) rotate(2.5deg)}}
.smoke{position:absolute;left:18px;bottom:30px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);
 filter:blur(5px);opacity:0}
.out .flame{display:none}.out #glow{opacity:0}
.out .smoke{animation:smoke 2.6s ease-out forwards}
.out .smoke:nth-child(3){animation-delay:.35s;left:22px}.out .smoke:nth-child(4){animation-delay:.7s;left:14px}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(14px,-130px) scale(5)}}

/* ===== Màn 4 ===== */
#gift{position:relative;width:200px;height:210px;margin:10px 0;perspective:700px;cursor:pointer}
#gift.shake{animation:shake .5s linear infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) translateX(-6px)}40%{transform:rotate(8deg) translateX(6px)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
.gbase{position:absolute;bottom:0;left:10px;width:180px;height:140px;border-radius:6px 6px 12px 12px;
 background:linear-gradient(90deg,#7b1f3e,#b53a62 45%,#7b1f3e);box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 -14px 24px rgba(0,0,0,.3)}
.gbase::before,.glid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:30px;margin-left:-15px;
 background:linear-gradient(90deg,#c9a45c,#f6e2a8 50%,#c9a45c)}
.glid{position:absolute;left:0;top:30px;width:200px;height:56px;border-radius:8px;transition:transform 1s cubic-bezier(.2,.8,.3,1),opacity 1s;
 background:linear-gradient(90deg,#8e2c4a,#cf4a78 45%,#8e2c4a);box-shadow:0 8px 18px rgba(0,0,0,.45);transform-origin:0 100%}
.bow{position:absolute;left:50%;top:-30px;margin-left:-34px;width:68px;height:40px}
.bow::before,.bow::after{content:"";position:absolute;top:2px;width:32px;height:30px;border:7px solid #f0d58f;border-radius:50% 50% 50% 8%;
 box-shadow:0 0 10px rgba(233,201,138,.5)}
.bow::before{left:0;transform:rotate(-12deg)}.bow::after{right:0;transform:scaleX(-1) rotate(-12deg)}
.knot{position:absolute;left:50%;top:10px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#f6e2a8;z-index:2}
#gift.open .glid{transform:translateY(-190px) rotate(-26deg) translateX(-50px);opacity:0}
#gift.gone{opacity:0;transform:scale(.6);transition:all .8s}
#giftTxt{font-size:clamp(21px,5.8vw,26px);font-style:italic;max-width:290px;line-height:1.4;margin-bottom:10px;transition:opacity .5s}
#tapOpen{margin-top:18px;background:none;border:1px solid var(--gold);color:var(--gold);padding:10px 22px;border-radius:30px;
 font:italic 19px 'Cormorant Garamond',Georgia,serif;cursor:pointer;transition:opacity .5s}
#card{position:absolute;inset:0;margin:auto;aspect-ratio:960/1353;height:min(94dvh,calc(94vw*1353/960));max-width:94vw;
 border-radius:14px;overflow:hidden;box-shadow:0 0 0 5px rgba(217,180,110,.35),0 30px 70px rgba(0,0,0,.7),0 0 60px rgba(243,169,187,.4);
 opacity:0;transform:translateY(80px) scale(.3);visibility:hidden;transition:all 1.2s cubic-bezier(.2,.9,.3,1.1)}
#card.show{opacity:1;transform:none;visibility:visible}
#card img{width:100%;height:100%;display:block;object-fit:cover}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- =====================================================================
     ÂM THANH — THAY TÊN FILE NHẠC CỦA BẠN Ở ĐÂY (đặt cùng thư mục với index.html)
     • dieuky.mp3   : nhạc phép thuật  (Màn 1)
     • hoihop.mp3   : nhạc hồi hộp     (Màn 2, suốt 10 giây đếm ngược)
     • sinhnhat.mp3 : nhạc sinh nhật   (Màn 3 → Màn 4, lặp liên tục, không ngắt)
     Tiếng pháo giấy nổ được tạo bằng Web Audio API nên không cần file riêng.
     ===================================================================== -->
<audio id="dieuky" src="dieuky.mp3" preload="auto"></audio>
<audio id="hoihop" src="hoihop.mp3" preload="auto"></audio>
<audio id="sinhnhat" src="sinhnhat.mp3" loop preload="auto"></audio>

<!-- Nút bật/tắt âm thanh (luôn hiển thị ở góc trên bên phải) -->
<button id="muteBtn" aria-label="Bật/tắt âm thanh">🔊</button>

<!-- MÀN 1 -->
<section class="screen active" id="s1">
  <div class="heart">♥</div>
  <p>Có một điều bí mật dành riêng cho bạn.<br>Chạm vào màn hình để mở...</p>
</section>

<!-- MÀN 2 -->
<section class="screen" id="s2">
  <div id="num">10</div>
  <div id="tease">Hít một hơi thật sâu nào...</div>
</section>

<!-- MÀN 3 -->
<section class="screen" id="s3">
  <h2 class="script">Happy Birthday</h2>
  <div id="hint3">Hãy thổi vào micro để tắt nến nhé</div>
  <div id="cakeWrap">
    <div id="glow"></div>
    <svg id="cake" viewBox="0 0 340 470" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="t1" x1="0" x2="1"><stop offset="0" stop-color="#d9517e"/><stop offset=".5" stop-color="#f27fa3"/><stop offset="1" stop-color="#c63f6c"/></linearGradient>
        <linearGradient id="t2" x1="0" x2="1"><stop offset="0" stop-color="#f3dcc0"/><stop offset=".5" stop-color="#fff3e2"/><stop offset="1" stop-color="#ead0b0"/></linearGradient>
        <linearGradient id="t3" x1="0" x2="1"><stop offset="0" stop-color="#e895b0"/><stop offset=".5" stop-color="#fbbfd0"/><stop offset="1" stop-color="#e28aa8"/></linearGradient>
        <linearGradient id="plate" x1="0" x2="1"><stop offset="0" stop-color="#b8923f"/><stop offset=".5" stop-color="#f6e2a8"/><stop offset="1" stop-color="#b8923f"/></linearGradient>
        <g id="rose"><circle r="11" fill="#e0527c"/><path d="M-6 0a6 6 0 0 1 12 0a4 4 0 0 1-8 0a2 2 0 0 1 4 0" fill="none" stroke="#fff0f4" stroke-width="1.6"/></g>
        <g id="leaf"><ellipse rx="9" ry="4" fill="#5d9a64"/></g>
      </defs>
      <!-- đĩa -->
      <ellipse cx="170" cy="440" rx="160" ry="20" fill="url(#plate)"/>
      <!-- tầng 1 (dưới) -->
      <rect x="40" y="330" width="260" height="105" rx="14" fill="url(#t1)"/>
      <path d="M40 345q22 26 44 0t44 0 44 0 44 0 44 0 44 0v-12a14 14 0 0 0-14-14H54a14 14 0 0 0-14 14z" fill="#fff3e2"/>
      <!-- tầng 2 -->
      <rect x="75" y="240" width="190" height="96" rx="14" fill="url(#t2)"/>
      <path d="M75 254q16 22 32 0t32 0 32 0 32 0 32 0v-12a14 14 0 0 0-14-14H89a14 14 0 0 0-14 14z" fill="#f08bab"/>
      <!-- tầng 3 -->
      <rect x="108" y="160" width="124" height="86" rx="12" fill="url(#t3)"/>
      <path d="M108 172q15 20 31 0t31 0 31 0 31 0v-10a12 12 0 0 0-12-12H120a12 12 0 0 0-12 12z" fill="#fff3e2"/>
      <!-- hoa trang trí -->
      <g><use href="#leaf" x="62" y="416"/><use href="#rose" x="52" y="410"/><use href="#leaf" x="104" y="416"/><use href="#rose" x="118" y="414"/>
         <use href="#leaf" x="236" y="416"/><use href="#rose" x="224" y="414"/><use href="#leaf" x="278" y="416"/><use href="#rose" x="290" y="410"/></g>
      <g><use href="#rose" x="96" y="322" transform="scale(.8)" /><circle cx="110" cy="236" r="5" fill="#fff"/><circle cx="170" cy="240" r="5" fill="#fff"/><circle cx="230" cy="236" r="5" fill="#fff"/></g>
      <g fill="#e9c98a"><circle cx="140" cy="212" r="4"/><circle cx="170" cy="218" r="4"/><circle cx="200" cy="212" r="4"/></g>
      <use href="#rose" x="106" y="152"/><use href="#leaf" x="124" y="156"/><use href="#rose" x="234" y="152"/><use href="#leaf" x="216" y="156"/>
      <!-- nến -->
      <rect x="161" y="94" width="18" height="64" rx="4" fill="#fff6e6"/>
      <path d="M161 112l18 8M161 128l18 8M161 144l18 8" stroke="#e9738f" stroke-width="4"/>
      <rect x="169" y="86" width="2.5" height="10" fill="#4a2a1a"/>
    </svg>
    <!-- ngọn lửa (đặt ở đỉnh nến) -->
    <div id="flameBox" title="Chạm để thổi tắt">
      <div class="flame"></div><div class="smoke"></div><div class="smoke"></div><div class="smoke"></div>
    </div>
  </div>
</section>

<!-- MÀN 4 -->
<section class="screen" id="s4">
  <div id="giftTxt">Hãy lắc nhẹ điện thoại để mở hộp quà bí mật!</div>
  <div id="gift">
    <div class="gbase"></div>
    <div class="glid"><div class="bow"></div><div class="knot"></div></div>
  </div>
  <button id="tapOpen">Hoặc chạm để mở</button>

<script>
/* ============ Tiện ích chung ============ */
const $ = id => document.getElementById(id);
const dieuky = $('dieuky'), hoihop = $('hoihop'), sinhnhat = $('sinhnhat');
let userMuted = false, music3On = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* Mở khóa thẻ <audio> trên di động: phát (tắt tiếng) rồi dừng ngay, thực hiện trong cú chạm đầu tiên */
function unlock(a){ a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = userMuted; }).catch(() => { a.muted = userMuted; }); }

/* Nút loa: tắt/bật toàn bộ âm thanh */
$('muteBtn').addEventListener('click', () => {
  userMuted = !userMuted;
  [dieuky, hoihop, sinhnhat].forEach(a => a.muted = userMuted);
  $('muteBtn').textContent = userMuted ? '🔇' : '🔊';
});
/* Nếu trình duyệt tự tạm dừng nhạc sinh nhật (vd. khi iOS bật micro) thì phát lại để nhạc không bị ngắt */
sinhnhat.addEventListener('pause', () => { if(music3On && !document.hidden) setTimeout(() => sinhnhat.play().catch(() => {}), 150); });

/* Tiếng pháo giấy nổ ngắn (Web Audio API) — chèn đè lên nhạc nền, không tắt nhạc */
function popSound(){
  if(userMuted || !audioCtx) return;
  audioCtx.resume();
  const t = audioCtx.currentTime, sr = audioCtx.sampleRate;
  for(let k = 0; k < 6; k++){
    const len = Math.floor(sr * .14), b = audioCtx.createBuffer(1, len, sr), d = b.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 4);
    const src = audioCtx.createBufferSource(); src.buffer = b;
    const f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 800 + Math.random()*2200;
    const g = audioCtx.createGain(); g.gain.value = k === 0 ? 1.3 : .6;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t + k*.06 + Math.random()*.03);
  }
}
let audioCtx = null, micStream = null, currentScreen = 1;

function show(n){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('s'+n).classList.add('active'); currentScreen = n;
}

/* ============ Hiệu ứng cánh hoa + pháo giấy (canvas) ============ */
const cv = $('fx'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
function resize(){ W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

const petalCols = ['#f9c2d1','#f4a3bb','#fde3ea','#e98aa6'];
const petals = Array.from({length: 26}, () => newPetal(true));
function newPetal(init){
  return {x:Math.random()*W, y: init ? Math.random()*H : -20, s:6+Math.random()*9, vy:.5+Math.random()*.9,
    vx:(Math.random()-.5)*.5, a:Math.random()*6.28, va:(Math.random()-.5)*.04, sw:Math.random()*6.28,
    c:petalCols[(Math.random()*petalCols.length)|0]};
}
let confetti = [];
const confCols = ['#f9c2d1','#e9c98a','#fff3cf','#e0527c','#ffffff','#f4a3bb'];
function burst(n, ox, oy){
  for(let i=0;i<n;i++){
    const ang = Math.random()*6.28, sp = 4+Math.random()*10;
    confetti.push({x:ox??W/2, y:oy??H*.55, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-5, w:5+Math.random()*6, h:8+Math.random()*8,
      a:Math.random()*6.28, va:(Math.random()-.5)*.4, c:confCols[(Math.random()*confCols.length)|0], life:1});
  }
}
let gentleRain = false; /* bật ở màn 4B: pháo giấy rơi nhẹ liên tục */
function loop(){
  ctx.clearRect(0,0,W,H);
  for(const p of petals){
    p.sw += .02; p.x += p.vx + Math.sin(p.sw)*.6; p.y += p.vy; p.a += p.va;
    if(p.y > H+20) Object.assign(p, newPetal(false), {x:Math.random()*W});
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = .85;
    ctx.beginPath(); ctx.moveTo(0,-p.s); ctx.bezierCurveTo(p.s,-p.s*.6,p.s*.8,p.s*.8,0,p.s); ctx.bezierCurveTo(-p.s*.8,p.s*.8,-p.s,-p.s*.6,0,-p.s); ctx.fill(); ctx.restore();
  }
  if(gentleRain && Math.random() < .35) confetti.push({x:Math.random()*W, y:-10, vx:(Math.random()-.5)*1.2, vy:1.2+Math.random()*1.5,
    w:5+Math.random()*4, h:8+Math.random()*6, a:Math.random()*6.28, va:(Math.random()-.5)*.2, c:confCols[(Math.random()*confCols.length)|0], life:1, soft:true});
  confetti = confetti.filter(c => c.y < H+30 && c.life > 0);
  for(const c of confetti){
    if(!c.soft){ c.vy += .22; c.vx *= .985; c.vy *= .985; c.life -= .004; }
    c.x += c.vx; c.y += c.vy; c.a += c.va;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a); ctx.globalAlpha = Math.max(c.life,0); ctx.fillStyle = c.c;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore();
  }
  requestAnimationFrame(loop);
}
loop();

/* ============ MÀN 1: chạm để mở ============ */
let started = false;
dieuky.volume = .9;
dieuky.play().catch(() => {}); /* thử tự phát khi tải trang (thường bị chặn trên di động → đã có phương án dự phòng bên dưới) */

$('s1').addEventListener('click', async () => {
  if(started) return; started = true;
  /* 1) Phát dieuky.mp3 NGAY trong cú chạm (vượt cơ chế chặn autoplay) */
  if(dieuky.paused){ dieuky.currentTime = 0; dieuky.play().catch(() => {}); }
  /* 2) Xin quyền cảm biến chuyển động (iOS 13+) — phải gọi ngay trong cú chạm */
  let motionReq = null;
  if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    motionReq = DeviceMotionEvent.requestPermission().catch(() => {});
  }
  /* 3) Mở khóa AudioContext (dùng cho tiếng pháo giấy) */
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
  /* 4) Mở khóa sẵn hoihop & sinhnhat để về sau phát được tự động */
  unlock(hoihop); unlock(sinhnhat);
  /* 5) Giữ khoảnh khắc "phép thuật" ~1.5 giây rồi mới sang màn 2 */
  $('s1').classList.add('magic');
  await Promise.all([motionReq, sleep(1500)]);
  show(2); startCountdown();
});

/* ============ MÀN 2: đếm ngược 10 → 0 ============ */
function teaseFor(n){
  if(n >= 8) return 'Hít một hơi thật sâu nào...';
  if(n >= 5) return 'Một ngày đặc biệt đã đến...';
  if(n >= 2) return 'Sắp có bất ngờ lớn rồi đây...';
  return 'Chúc mừng sinh nhật!';
}
function startCountdown(){
  let n = 10;
  /* Dừng hẳn dieuky.mp3, phát hoihop.mp3 suốt 10 giây */
  /* làm nhỏ dần ~0.3 giây rồi dừng hẳn (tránh bị cắt cụt tiếng) */
  { const v0 = dieuky.volume; let k = 0;
    const fo = setInterval(() => { k++; dieuky.volume = Math.max(v0*(1-k/6), 0);
      if(k >= 6){ clearInterval(fo); dieuky.pause(); dieuky.currentTime = 0; dieuky.volume = v0; } }, 50); }
  hoihop.currentTime = 0; hoihop.loop = true; hoihop.muted = userMuted; hoihop.play().catch(() => {});
  const tick = () => {
    const el = $('num'); el.textContent = n; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    $('tease').textContent = teaseFor(n);
    if(navigator.vibrate) navigator.vibrate(80);
    if(n === 0){ hoihop.pause(); hoihop.currentTime = 0; setTimeout(() => { show(3); enterCake(); }, 1200); return; }
    n--; setTimeout(tick, 1000);
  };
  tick();
}

/* ============ MÀN 3: bánh kem + thổi nến ============ */
let candleOut = false;
function enterCake(){
  /* Phát sinhnhat.mp3 (lặp lại) — chạy liên tục tới hết Màn 4, không bao giờ bị dừng */
  music3On = true; sinhnhat.loop = true; sinhnhat.volume = .85; sinhnhat.muted = userMuted;
  sinhnhat.play().catch(() => {});
  initMic();
}
$('flameBox').addEventListener('click', blowOut); /* dự phòng: chạm vào ngọn nến */

async function initMic(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    if(sinhnhat.paused) sinhnhat.play().catch(() => {}); /* iOS đôi khi dừng nhạc khi bật mic */
    const an = audioCtx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = .3;
    audioCtx.createMediaStreamSource(micStream).connect(an);
    const buf = new Uint8Array(an.fftSize), freq = new Uint8Array(an.frequencyBinCount);
    let strong = 0;
    const listen = () => {
      if(candleOut) return;
      an.getByteTimeDomainData(buf); an.getByteFrequencyData(freq);
      let sum = 0; for(let i=0;i<buf.length;i++){ const v = (buf[i]-128)/128; sum += v*v; }
      const rms = Math.sqrt(sum/buf.length);
      /* tiếng thổi = ồn rộng, nhiều năng lượng ở tần số thấp (< ~1.5kHz) */
      let low = 0; for(let i=2;i<40;i++) low += freq[i]; low /= 38;
      const NGUONG = 0.12; /* ← chỉnh độ nhạy: nhỏ hơn = nhạy hơn */
      if(rms > NGUONG*.5 || low > 90){
        strong++;
        $('flameBox').style.transform = `skewX(${Math.min(strong*4,38)}deg) scaleY(${Math.max(1-strong*.03,.7)})`;
      } else { strong = Math.max(strong-1,0); $('flameBox').style.transform = `skewX(${strong*4}deg)`; }
      if((rms > NGUONG && low > 60) && strong > 6){ blowOut(); return; }
      requestAnimationFrame(listen);
    };
    listen();
  }catch(e){
    $('hint3').textContent = 'Chạm vào ngọn nến để thổi tắt nhé';
  }
}

function blowOut(){
  if(candleOut) return; candleOut = true;
  $('flameBox').style.transform = 'skewX(45deg) scaleY(.4)';
  setTimeout(() => $('cakeWrap').classList.add('out'), 150);
  $('flameBox').classList.add('out');
  $('cakeWrap').classList.add('out');
  $('hint3').textContent = 'Điều ước đã được gửi đi ♥';
  if(micStream) micStream.getTracks().forEach(t => t.stop());
  popSound(); /* tiếng pháo giấy nổ, nhạc nền vẫn chạy */
  burst(90, W/2, H*.4);
  setTimeout(() => { show(4); enterGift(); }, 1500);
}

/* ============ MÀN 4: hộp quà → thiệp ============ */
let giftOpened = false, shakeScore = 0, lastAcc = null;
function enterGift(){
  addEventListener('devicemotion', onMotion);
}
function onMotion(e){
  if(giftOpened || currentScreen !== 4) return;
  const a = e.accelerationIncludingGravity || e.acceleration; if(!a) return;
  const m = Math.hypot(a.x||0, a.y||0, a.z||0);
  if(lastAcc !== null){
    const d = Math.abs(m - lastAcc);
    if(d > 12){ shakeScore += d; $('gift').classList.add('shake'); if(navigator.vibrate) navigator.vibrate(30); }
    else shakeScore = Math.max(shakeScore - .5, 0);
    if(shakeScore > 70) openGift();
  }
  lastAcc = m;
}
$('tapOpen').addEventListener('click', openGift);
$('gift').addEventListener('click', openGift);

function openGift(){
  if(giftOpened) return; giftOpened = true;
  removeEventListener('devicemotion', onMotion);
  const g = $('gift'); g.classList.add('shake');
  if(navigator.vibrate) navigator.vibrate([60,40,120]);
  setTimeout(() => { g.classList.remove('shake'); g.classList.add('open'); burst(160, W/2, H*.5); popSound(); }, 600);
  $('tapOpen').style.opacity = 0; $('giftTxt').style.opacity = 0;
  setTimeout(() => { g.classList.add('gone'); $('card').classList.add('show'); gentleRain = true; burst(80, W/2, H*.4); }, 1700);
}
</script>
